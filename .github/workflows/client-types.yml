name: Flutter Client Types Build

on:
  workflow_dispatch:
    inputs:
      build_full:
        description: 'Build Full Version'
        type: boolean
        default: true
      build_host:
        description: 'Build Host Version'
        type: boolean
        default: true
      build_client:
        description: 'Build Client Version'
        type: boolean
        default: true
      build_sos:
        description: 'Build SOS Version'
        type: boolean
        default: true

jobs:
  build-full-version:
    if: ${{ inputs.build_full }}
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "full"
      client-type: "full"
  
  build-host-version:
    if: ${{ inputs.build_host }}
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "host"
      client-type: "host"
  
  build-client-version:
    if: ${{ inputs.build_client }}
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "client"
      client-type: "client"
  
  build-sos-version:
    if: ${{ inputs.build_sos }}
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "sos"
      client-type: "sos"
  
